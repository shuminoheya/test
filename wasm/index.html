<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>WASM Fractal Lab</title>
<style>body{margin:0;background:#080a12;color:#eee;font-family:system-ui,sans-serif}main{max-width:1100px;margin:auto;padding:18px}h1{margin:0 0 6px}.sub{color:#9aa3b2}canvas{display:block;width:100%;max-height:72vh;object-fit:contain;background:#000;border:1px solid #303545;border-radius:10px;cursor:crosshair}.bar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:12px 0}.bar>*{background:#151a27;color:#eee;border:1px solid #343b4d;border-radius:7px;padding:8px 10px}button{cursor:pointer}label{display:flex;gap:7px;align-items:center}input{accent-color:#8ab4ff}.info{font-family:ui-monospace,monospace;color:#aeb8c9}.hint{font-size:13px;color:#8993a5}</style></head>
<body><main><h1>🌀 WASM Fractal Lab</h1><div class="sub">マンデルブロ集合をC製WASMで描画。クリック＝ズーム、ホイール＝ズーム倍率。</div>
<div class="bar"><button id="reset">リセット</button><button id="random">ランダム地点</button><label>反復 <input id="iter" type="range" min="50" max="1200" value="300"><b id="iv">300</b></label><button id="save">PNG保存</button></div>
<canvas id="cv" width="1000" height="700"></canvas><div class="bar info"><span id="status">WASM読み込み中…</span><span id="pos"></span></div><div class="hint">コツ：気になる場所をクリックすると4倍ズーム。右クリックでズームアウト。</div></main>
<script>
const cv=document.getElementById('cv'),ctx=cv.getContext('2d'),iter=document.getElementById('iter'),iv=document.getElementById('iv'),status=document.getElementById('status'),pos=document.getElementById('pos');
let wasm,mem,cx=-0.5,cy=0,scale=3.2,rendering=false;
async function init(){wasm=await WebAssembly.instantiateStreaming(fetch('fractal.wasm'),{});mem=wasm.instance.exports.memory;status.textContent='WASM OK / 描画準備完了';draw()}
function draw(){if(!wasm||rendering)return;rendering=true;iv.textContent=iter.value;const t=performance.now(),p=wasm.instance.exports.render(cx,cy,scale,cv.width,cv.height,+iter.value);const bytes=new Uint8ClampedArray(mem.buffer,p,cv.width*cv.height*4);ctx.putImageData(new ImageData(bytes,cv.width,cv.height),0,0);status.textContent=`WASM描画 ${(performance.now()-t).toFixed(1)} ms / ${cv.width}×${cv.height}`;rendering=false}
function zoomAt(e,f){const r=cv.getBoundingClientRect(),x=(e.clientX-r.left)/r.width,y=(e.clientY-r.top)/r.height;cx+=((x-.5)*scale*(cv.width/cv.height));cy+=(y-.5)*scale;scale*=f;pos.textContent=`center ${cx.toFixed(8)}, ${cy.toFixed(8)} / scale ${scale.toExponential(3)}`;draw()}
cv.onclick=e=>zoomAt(e,.25);cv.oncontextmenu=e=>{e.preventDefault();zoomAt(e,4)};cv.onwheel=e=>{e.preventDefault();zoomAt(e,e.deltaY<0?.75:1.333333)};
iter.oninput=draw;document.getElementById('reset').onclick=()=>{cx=-.5;cy=0;scale=3.2;draw()};document.getElementById('random').onclick=()=>{cx=-2+Math.random()*2;cy=-1.2+Math.random()*2.4;scale=.7;draw()};document.getElementById('save').onclick=()=>{const a=document.createElement('a');a.href=cv.toDataURL('image/png');a.download='wasm-fractal.png';a.click()};
init().catch(e=>{status.textContent='WASM読み込み失敗: '+e;console.error(e)});
</script></body></html>
