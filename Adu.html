  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realtime GPS Tracker & Map</title>
    <!-- 地図ライブラリ Leaflet のCSS -->
    <link rel="stylesheet" href="https://unpkg.com" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <style>
        :root {
            --bg-color: #0d1117;
            --panel-bg: #161b22;
            --accent-color: #00ff66; /* 近未来風のグリーン */
            --text-color: #c9d1d9;
            --border-color: #30363d;
        }

        body {
            font-family: 'Courier New', Courier, monospace, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            min-height: 100vh;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            width: 100%;
            max-width: 800px;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        h1 {
            font-size: 1.3rem;
            text-align: center;
            margin: 0;
            color: var(--accent-color);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 2px dashed var(--border-color);
            padding-bottom: 10px;
        }

        .main-layout {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* PC環境では横並び、スマホ環境では縦並び */
        @media (min-width: 650px) {
            .main-layout {
                flex-direction: row;
            }
            .data-grid {
                flex: 1;
            }
            #map {
                flex: 1.2;
                height: 400px !important;
            }
        }

        .btn-container {
            display: flex;
            justify-content: center;
        }

        button {
            background-color: transparent;
            color: var(--accent-color);
            border: 2px solid var(--accent-color);
            padding: 12px 24px;
            font-size: 1rem;
            font-weight: bold;
            font-family: inherit;
            cursor: pointer;
            border-radius: 6px;
            transition: all 0.3s ease;
            text-transform: uppercase;
        }

        /* 追跡中にボタンを赤く点滅させるアニメーション */
        button.tracking {
            background-color: #ff3333;
            color: #fff;
            border-color: #ff3333;
            animation: pulse 1.5s infinite;
        }

        .data-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 8px;
        }

        .data-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: rgba(255, 255, 255, 0.02);
            border-left: 3px solid var(--border-color);
            font-size: 0.9rem;
        }

        .data-item.active {
            border-left-color: var(--accent-color);
        }

        .label {
            color: #8b949e;
        }

        .value {
            font-weight: bold;
        }

        #map {
            width: 100%;
            height: 300px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            z-index: 1;
        }

        .status {
            font-size: 0.8rem;
            text-align: center;
            color: #8b949e;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Live Telemetry & Map</h1>
    
    <div class="btn-container">
        <button id="track-btn">Start Tracking</button>
    </div>

    <div class="main-layout">
        <!-- 各種データ表示エリア -->
        <div class="data-grid">
            <div class="data-item" id="item-lat">
                <span class="label">緯度 (Lat)</span>
                <span class="value" id="val-lat">--</span>
            </div>
            <div class="data-item" id="item-lng">
                <span class="label">経度 (Lng)</span>
                <span class="value" id="val-lng">--</span>
            </div>
            <div class="data-item" id="item-alt">
                <span class="label">高度 (Alt)</span>
                <span class="value" id="val-alt">--</span>
            </div>
            <div class="data-item" id="item-heading">
                <span class="label">角度 (Heading)</span>
                <span class="value" id="val-heading">--</span>
            </div>
            <div class="data-item" id="item-speed">
                <span class="label">速度 (Speed)</span>
                <span class="value" id="val-speed">--</span>
            </div>
            <div class="data-item" id="item-time">
                <span class="label">更新 (Time)</span>
                <span class="value" id="val-time">--</span>
            </div>
        </div>

        <!-- 地図表示エリア -->
        <div id="map"></div>
    </div>

    <div class="status" id="status-text">System Ready. HTTPS/Localhost required.</div>
</div>

<!-- 地図ライブラリ Leaflet のJavaScript -->
<script src="https://unpkg.com" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

<script>
    let watchId = null;
    let map = null;
    let marker = null;
    let accuracyCircle = null;

    const trackBtn = document.getElementById('track-btn');
    const statusText = document.getElementById('status-text');

    // 地図の初期化（起動時は日本全体を表示）
    function initMap() {
        map = L.map('map').setView([35.681236, 139.767125], 5);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://openstreetmap.org">OpenStreetMap</a>'
        }).addTo(map);
    }

    initMap();

    trackBtn.addEventListener('click', () => {
        // すでに追跡中の場合は停止処理をする
        if (watchId !== null) {
            navigator.geolocation.clearWatch(watchId);
            watchId = null;
            trackBtn.textContent = "Start Tracking";
            trackBtn.classList.remove('tracking');
            statusText.textContent = "Tracking stopped.";
            return;
        }

        if (!navigator.geolocation) {
            statusText.textContent = "Error: Geolocation not supported.";
            return;
        }

        statusText.textContent = "Connecting to GPS...";
        trackBtn.textContent = "Stop Tracking";
        trackBtn.classList.add('tracking');

        // GPSオプション（高精度モードを有効化）
        const options = {
            enableHighAccuracy: true,
            timeout: 10000,
            maximumAge: 0
        };

        // watchPosition で移動を監視し、リアルタイムに自動更新
        watchId = navigator.geolocation.watchPosition(
            (position) => {
                const coords = position.coords;
                
                const lat = coords.latitude;
                const lng = coords.longitude;
                const alt = coords.altitude !== null ? coords.altitude.toFixed(1) + ' m' : 'N/A';
                const heading = coords.heading !== null && !isNaN(coords.heading) ? coords.heading.toFixed(1) + '°' : 'N/A';
                // m/s（秒速）から km/h（時速）に変換
                const speed = coords.speed !== null && !isNaN(coords.speed) ? (coords.speed * 3.6).toFixed(1) + ' km/h' : '0.0 km/h';
                
                // ミリ秒まで含む現在の時刻を取得
                const date = new Date(position.timestamp);
                const timeStr = date.toLocaleTimeString('ja-JP') + '.' + String(date.getMilliseconds()).padStart(3, '0');

                // 画面上のテキストを更新
                document.getElementById('val-lat').textContent = lat.toFixed(6) + '°';
                document.getElementById('val-lng').textContent = lng.toFixed(6) + '°';
                document.getElementById('val-alt').textContent = alt;
                document.getElementById('val-heading').textContent = heading;
                document.getElementById('val-speed').textContent = speed;
                document.getElementById('val-time').textContent = timeStr;

                // パネルの横のボーダーをアクティブカラー（緑）に変更
                document.querySelectorAll('.data-item').forEach(item => item.classList.add('active'));
                statusText.textContent = `Receiving live data (Accuracy: ±${coords.accuracy.toFixed(0)}m)`;

                // 地図上のマーカー（現在地ピン）を動かす
                if (map) {
                    map.setView([lat, lng], 16); // 現在地を中心にズーム

                    if (marker) {
                        marker.setLatLng([lat, lng]);
                    } else {
                        marker = L.marker([lat, lng]).addTo(map);
                    }

                    // GPSの精度（誤差範囲）を表す青い円サークルを更新
                    if (accuracyCircle) {
                        accuracyCircle.setLatLng([lat, lng]);
                        accuracyCircle.setRadius(coords.accuracy);
                    } else {
                        accuracyCircle = L.circle([lat, lng], {
                            radius: coords.accuracy,
                            color: '#0066ff',
                            fillColor: '#0066ff',
                            fillOpacity: 0.15
                        }).addTo(map);
                    }
                }
            },
            (error) => {
                statusText.textContent = `Error: ${error.message}`;
             },
            options
        );
    });
</script>
